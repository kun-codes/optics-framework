name: Run Tests on Emulator

on:
    pull_request:
    push:
    workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest  # cannot use ubuntu arm64 runners because they don't have an emulator available
    # source: https://github.com/ReactiveCircus/android-emulator-runner/issues/458#issuecomment-3711372414
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Test App
        run: gh release download v1.2.1 --repo mozarkai/optics-test-app --pattern app-release.apk  # version is pinned because
        # of potential breaking changes in the test app

      - name: Install tree command
        run: sudo apt-get install tree

      - name: run tree command
        run: tree

      - name: Start Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35  # api level 35 because it supports running arm64 apps on x86 emulators
          arch: x86_64
          script: |
            adb devices
            adb install app-release.apk
